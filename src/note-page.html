<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Paused — No Not Again</title>
        <link rel="icon" href="icons/icon-32.png" />
        <link rel="stylesheet" href="theme.css" />
        <link rel="stylesheet" href="note-page.css" />
    </head>

    <body>
        <main class="pause">
            <header class="pause-header">
                <img src="icons/icon-48.png" alt="" class="pause-icon" />
                <div class="site-pill" id="domainName"></div>
            </header>

            <div id="loading" class="loading">Loading…</div>

            <div id="noteContent" hidden>
                <p class="note-text" id="noteBox"><span id="noteText"></span></p>

                <figure class="quote" id="quoteBox" hidden>
                    <blockquote id="quoteText"></blockquote>
                    <figcaption id="quoteAuthor"></figcaption>
                </figure>

                <div class="actions" id="mainActions">
                    <button class="btn btn-primary btn-large" id="backBtn">Go back</button>
                    <button class="btn btn-secondary btn-large" id="bypassBtn">
                        Continue anyway
                    </button>
                </div>

                <div class="bypass" id="bypassOptions" hidden>
                    <p class="bypass-title">Continue for</p>
                    <div class="durations">
                        <button
                            class="btn btn-secondary bypass-duration-btn"
                            data-duration="3600000"
                        >
                            1 hour
                        </button>
                        <button
                            class="btn btn-secondary bypass-duration-btn"
                            data-duration="21600000"
                        >
                            6 hours
                        </button>
                        <button
                            class="btn btn-secondary bypass-duration-btn"
                            data-duration="86400000"
                        >
                            1 day
                        </button>
                        <button
                            class="btn btn-secondary bypass-duration-btn"
                            data-duration="604800000"
                        >
                            1 week
                        </button>
                    </div>
                    <button class="link muted" id="cancelBypassBtn">Cancel</button>
                </div>

                <button class="link muted stop" id="deleteBtn">Stop blocking this site</button>
            </div>

            <div id="errorBox" class="error" hidden>
                <p id="errorMessage"></p>
                <button class="btn btn-secondary" id="errorBackBtn">Go back</button>
            </div>
        </main>
        <script type="module" src="note-page.js"></script>
    </body>
</html>
